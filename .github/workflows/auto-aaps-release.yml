name: Auto-build official AAPS releases

on:
  schedule:
    # Daily check. This workflow is scoped to this repository only.
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: aaps-official-release-watcher
  cancel-in-progress: false

env:
  UPSTREAM_REPO: nightscout/AndroidAPS
  BASELINE_TAG: 3.4.2.3
  TARGET_WORKFLOW: aaps-ci.yml

jobs:
  detect-and-dispatch:
    name: Detect missing official releases
    runs-on: ubuntu-latest

    steps:
      - name: Decode Google Drive OAuth2 secret
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${{ secrets.GDRIVE_OAUTH2 }}" ]; then
            echo "❌ Missing repository secret GDRIVE_OAUTH2"
            exit 1
          fi

          DECODED=$(printf '%s' "${{ secrets.GDRIVE_OAUTH2 }}" | base64 -d)
          GDRIVE_CLIENT_ID=$(printf '%s' "$DECODED" | cut -d'|' -f1)
          GDRIVE_REFRESH_TOKEN=$(printf '%s' "$DECODED" | cut -d'|' -f2)

          if [ -z "$GDRIVE_CLIENT_ID" ] || [ -z "$GDRIVE_REFRESH_TOKEN" ]; then
            echo "❌ Invalid GDRIVE_OAUTH2 format"
            exit 1
          fi

          echo "::add-mask::$GDRIVE_CLIENT_ID"
          echo "::add-mask::$GDRIVE_REFRESH_TOKEN"
          echo "GDRIVE_CLIENT_ID=$GDRIVE_CLIENT_ID" >> "$GITHUB_ENV"
          echo "GDRIVE_REFRESH_TOKEN=$GDRIVE_REFRESH_TOKEN" >> "$GITHUB_ENV"

      - name: Get Google Drive access token
        shell: bash
        run: |
          set -euo pipefail

          TOKEN_RESPONSE=$(curl -fsS -X POST https://oauth2.googleapis.com/token             -d client_id="$GDRIVE_CLIENT_ID"             -d refresh_token="$GDRIVE_REFRESH_TOKEN"             -d grant_type=refresh_token)

          ACCESS_TOKEN=$(printf '%s' "$TOKEN_RESPONSE" | jq -r '.access_token // empty')

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "❌ Failed to obtain a Google Drive access token"
            exit 1
          fi

          echo "::add-mask::$ACCESS_TOKEN"
          echo "ACCESS_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_ENV"

      - name: Find AAPS Google Drive folder
        shell: bash
        run: |
          set -euo pipefail

          QUERY="name='AAPS' and mimeType='application/vnd.google-apps.folder' and trashed=false"
          ENCODED_QUERY=$(python3 -c "import urllib.parse; print(urllib.parse.quote('''$QUERY'''))")

          AAPS_FOLDER_ID=$(curl -fsS             -H "Authorization: Bearer $ACCESS_TOKEN"             "https://www.googleapis.com/drive/v3/files?q=$ENCODED_QUERY&fields=files(id,name)"             | jq -r '.files[0].id // empty')

          if [ -z "$AAPS_FOLDER_ID" ]; then
            echo "ℹ️ No AAPS folder exists yet; all eligible releases will be considered missing."
          fi

          echo "AAPS_FOLDER_ID=$AAPS_FOLDER_ID" >> "$GITHUB_ENV"

      - name: Detect stable upstream releases missing from Google Drive
        id: detect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RELEASES=$(curl -fsS             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$UPSTREAM_REPO/releases?per_page=100")

          mapfile -t TAGS < <(
            printf '%s' "$RELEASES"               | jq -r '.[] | select(.draft == false and .prerelease == false) | .tag_name'               | grep -E '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$'               | sort -V
          )

          MISSING_TAGS=()

          for TAG in "${TAGS[@]}"; do
            HIGHEST=$(printf '%s\n%s\n' "$BASELINE_TAG" "$TAG" | sort -V | tail -n 1)
            if [ "$TAG" = "$BASELINE_TAG" ] || [ "$HIGHEST" != "$TAG" ]; then
              continue
            fi

            APP_NAME="aaps-$TAG.apk"
            WEAR_NAME="aaps-wear-$TAG.apk"
            VERSION_FOLDER_ID=""

            if [ -n "$AAPS_FOLDER_ID" ]; then
              QUERY="name='$TAG' and mimeType='application/vnd.google-apps.folder' and '$AAPS_FOLDER_ID' in parents and trashed=false"
              ENCODED_QUERY=$(python3 -c "import urllib.parse; print(urllib.parse.quote('''$QUERY'''))")

              VERSION_FOLDER_ID=$(curl -fsS                 -H "Authorization: Bearer $ACCESS_TOKEN"                 "https://www.googleapis.com/drive/v3/files?q=$ENCODED_QUERY&fields=files(id)"                 | jq -r '.files[0].id // empty')
            fi

            APP_ID=""
            WEAR_ID=""

            if [ -n "$VERSION_FOLDER_ID" ]; then
              for NAME in "$APP_NAME" "$WEAR_NAME"; do
                QUERY="name='$NAME' and '$VERSION_FOLDER_ID' in parents and trashed=false"
                ENCODED_QUERY=$(python3 -c "import urllib.parse; print(urllib.parse.quote('''$QUERY'''))")

                FILE_ID=$(curl -fsS                   -H "Authorization: Bearer $ACCESS_TOKEN"                   "https://www.googleapis.com/drive/v3/files?q=$ENCODED_QUERY&fields=files(id)"                   | jq -r '.files[0].id // empty')

                if [ "$NAME" = "$APP_NAME" ]; then
                  APP_ID="$FILE_ID"
                else
                  WEAR_ID="$FILE_ID"
                fi
              done
            fi

            if [ -n "$APP_ID" ] && [ -n "$WEAR_ID" ]; then
              echo "✅ $TAG already present in Google Drive"
            else
              echo "🆕 $TAG missing or incomplete in Google Drive"
              MISSING_TAGS+=("$TAG")
            fi
          done

          if [ "${#MISSING_TAGS[@]}" -eq 0 ]; then
            echo "✅ No missing stable AAPS releases found."
            echo "missing_tags=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf 'Missing releases: %s\n' "${MISSING_TAGS[*]}"
          {
            echo "missing_tags<<EOF"
            printf '%s\n' "${MISSING_TAGS[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch AAPS CI for missing releases
        if: steps.detect.outputs.missing_tags != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MISSING_TAGS: ${{ steps.detect.outputs.missing_tags }}
        run: |
          set -euo pipefail

          while IFS= read -r TAG; do
            [ -z "$TAG" ] && continue

            echo "🚀 Dispatching $TARGET_WORKFLOW for AAPS $TAG"

            curl -fsS -X POST               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer $GH_TOKEN"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/${{ github.repository }}/actions/workflows/$TARGET_WORKFLOW/dispatches"               -d "$(jq -nc --arg ref "${{ github.event.repository.default_branch }}" --arg tag "$TAG"                 '{ref:$ref,inputs:{tagName:$tag,buildVariant:"fullRelease"}}')"

            echo "✅ Dispatch requested for $TAG"
          done <<< "$MISSING_TAGS"
